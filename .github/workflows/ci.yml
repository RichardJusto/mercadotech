name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pin de npm (decisión 10): el lockfile lo generó npm 10.9.8 en Windows: un
# npm más nuevo en el runner de Linux resuelve las dependencias opcionales
# distinto y falla con "Missing ... from lock file" (lección de ReadHub).
env:
  PACKAGE_MANAGER_NPM_VERSION: "10.9.8"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pin npm a la versión que generó el lockfile
        run: npm install -g npm@${{ env.PACKAGE_MANAGER_NPM_VERSION }}

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Tests unitarios + cobertura
        run: npm run test:coverage

      - name: Instalar dependencias del servidor MCP
        run: npm ci --prefix mcp

      - name: Type-check del servidor MCP
        run: npm run type-check --prefix mcp

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: e2e
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pin npm a la versión que generó el lockfile
        run: npm install -g npm@${{ env.PACKAGE_MANAGER_NPM_VERSION }}

      - name: Instalar dependencias
        run: npm ci

      - name: Cachear navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium de Playwright (solo el navegador de CI)
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Levantar Supabase local y sembrar el seed
        run: |
          supabase start
          supabase db reset

      - name: Leer credenciales del stack efímero (NO son secretos — decisión 11)
        run: |
          STATUS=$(supabase status -o json)
          echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: E2E (chromium) — el webServer del config hace build && start
        run: npx playwright test --project=chromium
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Subir reporte HTML + screenshots del fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Apagar Supabase local
        if: always()
        run: supabase stop
